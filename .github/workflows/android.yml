name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıkları kur ve web uygulamasını derle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DUS-Akademi.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: DUS-Akademi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Telefondan indirmek için sürüm (Release) oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DUS Akademi 1.0.${{ github.run_number }}
          body: Telefona kurmak için aşağıdaki DUS-Akademi.apk dosyasına dokun.
          files: DUS-Akademi.apk
          make_latest: true
